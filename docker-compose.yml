# FinTrack full stack – Docker Compose (root)
#
# Run everything:
#   docker compose up
#   Backend API: http://localhost:8000
#   Frontend (Expo dev): http://localhost:8081
#   Postgres: localhost:5432
#
# Frontend only (dev):  docker compose up frontend
# Frontend only (web):  docker compose --profile web up frontend-web
# Backend + DB only:   docker compose up db app

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build:
      context: "./backend"
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      ENVIRONMENT: ${ENVIRONMENT}
      CORS_ORIGINS: ${CORS_ORIGINS}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      VERIFICATION_CODE_EXPIRE_MINUTES: ${VERIFICATION_CODE_EXPIRE_MINUTES}
      IS_DROP_TABLES: ${IS_DROP_TABLES}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8081:8081"
    environment:
      - CI=1
      - EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL}
      - EXPO_PUBLIC_USE_MOCK=${EXPO_PUBLIC_USE_MOCK}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true

  frontend-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: web
    ports:
      - "8080:80"
    profiles:
      - web

volumes:
  postgres_data:
