# FinTrack full stack – Docker Compose (root)
#
# Run everything:
#   docker compose up
#   Backend API: http://localhost:8000
#   Frontend (Expo dev): http://localhost:8081
#   Postgres: localhost:5432
#
# Frontend only (dev):  docker compose up frontend
# Frontend only (web):  docker compose --profile web up frontend-web
# Backend + DB only:   docker compose up db app

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fintrack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build:
      context: "./backend"
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-fintrack}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8081","http://localhost:8080"]}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      VERIFICATION_CODE_EXPIRE_MINUTES: ${VERIFICATION_CODE_EXPIRE_MINUTES:-10}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8081:8081"
    environment:
      - CI=1
      - EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - EXPO_PUBLIC_USE_MOCK=${EXPO_PUBLIC_USE_MOCK:-false}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true

  frontend-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: web
    ports:
      - "8080:80"
    profiles:
      - web

volumes:
  postgres_data:
